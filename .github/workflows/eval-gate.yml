# Planner eval gate (docs/03-evals.md). Runs when a change can move planner quality:
# prompt, plan schema, model settings, or the eval set itself. Fails on any per-intent
# regression below evals/thresholds.json. Needs the OPENAI_API_KEY repository secret;
# without it the job reports a skip instead of failing. Cost: about $0.31 per run (k=3).
name: eval-gate
on:
  pull_request:
    paths:
      - "src/trialviz/llm/**"
      - "src/trialviz/plan.py"
      - "src/trialviz/config.py"
      - "evals/**"
  workflow_dispatch:

jobs:
  planner-eval:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - name: Skip without key
        if: env.OPENAI_API_KEY == ''
        run: echo "::warning::OPENAI_API_KEY secret is not set; planner eval gate skipped."
      - name: Planner evals, k=3, gated
        if: env.OPENAI_API_KEY != ''
        run: uv run python -m evals.planner_eval --runs 3 --gate
      - uses: actions/upload-artifact@v4
        if: always() && env.OPENAI_API_KEY != ''
        with:
          name: planner-eval-results
          path: evals/results/
